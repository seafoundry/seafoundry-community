overrides:
  - organismKind: oyster
    dialogType: general
    title: Oyster Observation
    fields:
      - field: target
        kind: targetPicker
        label: Observation Target
        required: true
      - field: severity
        kind: dropdown
        label: Severity
        options:
          - value: mild
            label: Mild
          - value: moderate
            label: Moderate
          - value: severe
            label: Severe
      - field: comment
        kind: multilineText
        label: Notes
      - field: imageUrl
        kind: text
        label: Image URL
    requiredFields:
      - target
      - severity

  - organismKind: kelp
    dialogType: biofouling
    title: Kelp Biofouling
    fields:
      - field: target
        kind: targetPicker
        label: Line or Raft
        required: true
      - field: biofoulingTypeId
        kind: dropdown
        label: Fouling Type
        required: true
      - field: severity
        kind: dropdown
        label: Coverage
        required: true
        options:
          - value: low
            label: Low
          - value: medium
            label: Medium
          - value: high
            label: High
      - field: cleaningPerformed
        kind: toggle
        label: Cleaning performed
      - field: comment
        kind: multilineText
        label: Notes
    requiredFields:
      - target
      - biofoulingTypeId
      - severity

  - organismKind: seagrass
    dialogType: general
    title: Seagrass Plot Observation
    permitRequired: true
    fields:
      - field: target
        kind: targetPicker
        label: Quadrat or Transect
        required: true
      - field: extent
        kind: dropdown
        label: Percent Cover
        required: true
        options:
          - value: low
            label: '<25%'
          - value: medium
            label: 25-75%
          - value: high
            label: '>75%'
      - field: location
        kind: text
        label: Depth / Notes
      - field: comment
        kind: multilineText
        label: Observer Notes
    requiredFields:
      - target
      - extent
