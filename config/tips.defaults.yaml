tips:
  # --- CORALS ---
  - text: "Acropora cervicornis (Staghorn Coral) is one of the fastest-growing corals on the reef, capable of growing 10-20 cm per year under optimal conditions."
    imageUrl: "https://images.unsplash.com/photo-1546026423-cc4642628d2b?auto=format&fit=crop&q=80&w=600"
    nodeType: "nursery"
    speciesId: "species_acropora_cervicornis"
    
  - text: "Zooxanthellae, the symbiotic algae living within coral tissue, provide up to 90% of the coral's energy requirements through photosynthesis."
    imageUrl: "https://images.unsplash.com/photo-1583212292454-1fe6229603b7?auto=format&fit=crop&q=80&w=600"
    role: "biologist"

  - text: "Micro-fragmentation can accelerate the growth rates of massive corals like Orbicella faveolata by 25-50 times compared to natural growth."
    imageUrl: "https://images.unsplash.com/photo-1520699697851-3dc68aa3a474?auto=format&fit=crop&q=80&w=600"
    speciesId: "species_orbicella_faveolata"

  - text: "Parrotfish are essential herbivores on Caribbean reefs. By grazing on macroalgae, they prevent it from smothering coral recruits."
    imageUrl: "https://images.unsplash.com/photo-1520699697851-3dc68aa3a474?auto=format&fit=crop&q=80&w=600"
    nodeType: "outplant"

  - text: "Elkhorn coral (Acropora palmata) was once the dominant reef-building coral in the Caribbean, forming massive thickets that protected coastlines from storms."
    imageUrl: "https://images.unsplash.com/photo-1546026423-cc4642628d2b?auto=format&fit=crop&q=80&w=600"
    speciesId: "species_acropora_palmata"

  # --- OYSTERS ---
  - text: "A single adult Eastern Oyster (Crassostrea virginica) can filter up to 50 gallons of water per day, significantly improving local water quality."
    imageUrl: "https://images.unsplash.com/photo-1717251752308-2ef72f07484e?auto=format&fit=crop&q=80&w=600"
    speciesId: "species_crassostrea_virginica"

  - text: "Oyster reefs create complex 3D structures that serve as nurseries for commercially important fish and crab species."
    imageUrl: "https://images.unsplash.com/photo-1717251752308-2ef72f07484e?auto=format&fit=crop&q=80&w=600"
    nodeType: "outplant"

  # --- MANGROVES ---
  - text: "Red mangroves (Rhizophora mangle) are 'salt excluders'—their roots filter out more than 90% of the salt from seawater."
    imageUrl: "https://images.unsplash.com/photo-1589556264800-08ae9e129a8c?auto=format&fit=crop&q=80&w=600"
    speciesId: "species_rhizophora_mangle"

  - text: "Mangrove forests are highly efficient carbon sinks, storing up to four times more carbon per hectare than terrestrial rainforests."
    imageUrl: "https://images.unsplash.com/photo-1589556264800-08ae9e129a8c?auto=format&fit=crop&q=80&w=600"
    role: "manager"

  # --- SEAGRASS ---
  - text: "Seagrass meadows occupy only 0.1% of the ocean floor but are responsible for 11% of the organic carbon buried in the ocean."
    imageUrl: "https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?auto=format&fit=crop&q=80&w=600"
    speciesId: "species_thalassia_testudinum"

  # --- URCHINS ---
  - text: "The Long-spined Sea Urchin (Diadema antillarum) is a keystone grazer. Its population crash in the 1980s contributed significantly to the algal dominance on Caribbean reefs."
    imageUrl: "https://images.unsplash.com/photo-1551244072-5d12893278ab?auto=format&fit=crop&q=80&w=600"
    speciesId: "species_diadema_antillarum"

  # --- HUSBANDRY & OPS ---
  - text: "Regular cleaning of nursery structures is critical to prevent biofouling, which can compete with corals for light and nutrients."
    imageUrl: "https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?auto=format&fit=crop&q=80&w=600"
    nodeType: "nursery"
    role: "technician"

  - text: "When outplanting, ensure the substrate is completely cleared of algae and sediment to maximize the attachment success of the new fragments."
    imageUrl: "https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?auto=format&fit=crop&q=80&w=600"
    nodeType: "outplant"
    role: "technician"

  - text: "Genotypic diversity is key to restoration success. Mixing genotypes in outplant sites increases the likelihood of successful sexual reproduction during spawning events."
    imageUrl: "https://images.unsplash.com/photo-1520699697851-3dc68aa3a474?auto=format&fit=crop&q=80&w=600"
    role: "manager"
