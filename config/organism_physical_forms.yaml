# Physical Form Configuration Schema
# Defines available physical forms, size bands, and measurement units for each
# organism kind at each life stage.
#
# Configuration Versioning:
# - Each change to this file should increment the version number
# - Version history is stored in config/organism_physical_forms_versions/
# - Existing organism records maintain their original version for snapshot integrity
#
# Structure:
#   organism_kind:
#     life_stage:
#       physical_forms:
#         - id: unique_identifier
#           display_name: Human-readable name
#           counting_mode: individual | volumetric
#           measurement_unit: count | substrates | milliliters | bags | etc.
#           size_bands:
#             - id: xs | small | medium | large | xl
#               label: Display label with size range
#               volume_mm3: Volumetric measurement in cubic millimeters
#               estimated_individuals: For batch mode, estimated population
#               sort_order: Display order (1, 2, 3...)

