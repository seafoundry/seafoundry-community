# Declares tier visibility for structured payloads. Shared/community fields are
# available to every tier. Pro-only fields are filtered for Community exports,
# while Scale-only fields represent automation/geometry overlays that should be
# hidden from both Community and Pro snapshots.
models:
  inventory_export_row:
    community:
      - provenanceId
      - localId
      - recordName
      - speciesId
      - organismKind
      - groupId
      - groupIdRaw
      - siteId
      - siteName
      - lifeStage
      - lifeStageLabel
      - lifeStageId
      - quantityValue
      - measurementUnit
      - eventDate
      - eventType
      - holdingKind
      - readyForOutplant
      - provenanceType
      - provenanceKind
      - structureType
    pro:
      - healthStatus
      - size
      - notes
      - lastEventAt
      - ownerOrganizationId
      - managingOrganizationId
      - foreignKeys
      - aliases
      - aliasesJson
      - lifeStageSubtype
      - physicalFormId
      - physicalForm
      - sizeBandId
      - permitId
      - permitType
      - issuingAuthority
      - validFrom
      - validTo
      - siteJurisdiction
      - habitatType
      - protectedAreaFlag
      - outplantPointsCsv
      - outplantKmlUrl
    scale:
      - geometryUpdatedAt
      - siteCenterLat
      - siteCenterLng
      - siteBboxNwLat
      - siteBboxNwLng
      - siteBboxSeLat
      - siteBboxSeLng
  genetics_row:
