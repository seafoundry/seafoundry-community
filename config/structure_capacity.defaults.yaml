group_type_longline:
  metrics:
    - scope: childStructures
      organism: kelp
      targetGroupType: group_type_dropper_line
      unitLabel: dropper lines
      maxUnits: 40
      warningThreshold: 0.85
      message: >
        Longlines typically carry up to 40 dropper lines. Schedule harvests or
        stage a new array before exceeding the rigging limits.
    - scope: occupants
      organism: kelp
      lifeStage: juvenile
      physicalFormId: seededLineSegment
      unitLabel: seeded segments
      maxUnits: 200
      warningThreshold: 0.8
      message: >
        Each longline is scoped for roughly 200 seeded segments. Shift biomass
        to a neighboring line before exceeding that loading.

group_type_dropper_line:
  metrics:
    - scope: occupants
      organism: kelp
      lifeStage: juvenile
      physicalFormId: seededLineSegment
      unitLabel: seeded segments
      maxUnits: 50
      warningThreshold: 0.9
      message: >
        Dropper lines support ~50 seeded segments before fouling and drag
        increase failure risk.

group_type_rack:
  metrics:
    - scope: childStructures
      organism: oyster
      targetGroupType: group_type_bag
      unitLabel: oyster bags
      maxUnits: 24
      warningThreshold: 0.83
      message: >
        Standard racks are kitted for 24 bags. Shift excess bags to another rack
        to maintain safe lifting loads.

group_type_bag:
  metrics:
    - scope: occupants
      organism: oyster
      lifeStage: juvenile
      physicalFormId: spatBag
      unitLabel: spat
      maxUnits: 1200
      warningThreshold: 0.9
      message: >
        Nursery spat bags hold ~1,200 juveniles before density drives mortality.

group_type_pen:
  metrics:
    - scope: occupants
      organism: finfish
      lifeStage: juvenile
      physicalFormId: batch
      unitLabel: fish
      maxUnits: 5000
      warningThreshold: 0.9
      message: >
        Pens exceeding 5,000 juveniles require additional aeration and feeding.

group_type_pond:
  metrics:
    - scope: occupants
      organism: crab
      lifeStage: juvenile
      physicalFormId: batch
      unitLabel: crabs
      maxUnits: 800
      warningThreshold: 0.85
      message: >
        Grow-out ponds sustain ~800 juvenile crabs. Split cohorts across ponds
        to avoid density stress.

group_type_quadrat:
  metrics:
    - scope: occupants
      organism: seagrass
      lifeStage: juvenile
      physicalFormId: sprigModule
      unitLabel: sprig modules
      maxUnits: 120
      warningThreshold: 0.85
      message: >
        Quadrat plots can stage roughly 120 sprig modules before shading and
        density slow growth. Schedule transplanting or split modules sooner if
        you approach this threshold.

group_type_plot_transect:
  metrics:
    - scope: occupants
      organism: mangrove
      lifeStage: juvenile
      physicalFormId: plotMat
      unitLabel: saplings
      maxUnits: 150
      warningThreshold: 0.8
      message: >
        Mangrove transects support approximately 150 saplings while maintaining
        safe spacing. Thin or expand the plot once this capacity is reached.
