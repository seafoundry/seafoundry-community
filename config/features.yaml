# Per-feature purchase configuration
#
# This file defines individual purchasable features for the per-feature
# paywall system. Each feature can be purchased separately as either
# a subscription (monthly/yearly) or one-time purchase.
#
# Note: Features listed here with `free: true` are available to all users.
# The Community tier features from tier_features.yaml remain free.

features:
  # AI & Automation
  ai_copilot:
    name: AI Copilot
    description: Sebastian AI assistant for insights, recommendations, and automation
    category: ai
    icon: smart_toy
    free: false
    prices:
      monthly:
        amount: 29
        currency: USD
        stripe_price_id: price_ai_copilot_monthly  # Replace with real Stripe ID
      yearly:
        amount: 290
        currency: USD
        stripe_price_id: price_ai_copilot_yearly
      one_time:
        amount: 599
        currency: USD
        stripe_price_id: price_ai_copilot_lifetime

  # Mobile & Offline
  offline_sync:
    name: Offline Sync & Mobile
    description: Mobile apps for iOS & Android with offline data capture and sync
    category: mobile
    icon: cloud_sync
    free: false
    prices:
      monthly:
        amount: 19
        currency: USD
        stripe_price_id: price_offline_sync_monthly
      yearly:
        amount: 190
        currency: USD
        stripe_price_id: price_offline_sync_yearly
      one_time:
        amount: 399
        currency: USD
        stripe_price_id: price_offline_sync_lifetime

  # Monitoring & Field Work
  monitoring_advanced:
    name: Advanced Monitoring
    description: KML exports, imagery attachments, and monitoring dialog for field work
    category: monitoring
    icon: monitor_heart
    free: false
    includes:
      - monitoring_kml
      - monitoring_dialog
      - imagery_attachments
    prices:
      monthly:
        amount: 20
        currency: USD
        stripe_price_id: price_monitoring_advanced_monthly
      yearly:
        amount: 200
        currency: USD
        stripe_price_id: price_monitoring_advanced_yearly
      one_time:
        amount: 399
        currency: USD
        stripe_price_id: price_monitoring_advanced_lifetime

  # Husbandry & Observations
  husbandry_actions:
    name: Husbandry Actions
    description: Record husbandry activities like feeding, cleaning, and treatments
    category: workflow
    icon: pets
    free: false
    prices:
      monthly:
        amount: 15
        currency: USD
        stripe_price_id: price_husbandry_actions_monthly
      yearly:
        amount: 150
        currency: USD
        stripe_price_id: price_husbandry_actions_yearly
      one_time:
        amount: 299
        currency: USD
        stripe_price_id: price_husbandry_actions_lifetime

  observation_actions:
    name: Observation Actions
    description: Log monitoring checks, environmental readings, and alerts
    category: workflow
    icon: visibility
    free: false
    prices:
      monthly:
        amount: 15
        currency: USD
        stripe_price_id: price_observation_actions_monthly
      yearly:
        amount: 150
        currency: USD
        stripe_price_id: price_observation_actions_yearly
      one_time:
        amount: 299
        currency: USD
        stripe_price_id: price_observation_actions_lifetime

  mortality_reasons:
    name: Mortality Tracking
    description: Detailed mortality reasons and tracking for inventory analysis
    category: workflow
    icon: analytics
    free: false
    prices:
      monthly:
        amount: 10
        currency: USD
        stripe_price_id: price_mortality_reasons_monthly
      yearly:
        amount: 100
        currency: USD
        stripe_price_id: price_mortality_reasons_yearly
      one_time:
        amount: 199
        currency: USD
        stripe_price_id: price_mortality_reasons_lifetime

  # Collaboration
  comments:
    name: Comments
    description: Add comments and discussions to inventory records and events
    category: collaboration
    icon: comment
    free: false
    prices:
      monthly:
        amount: 10
        currency: USD
        stripe_price_id: price_comments_monthly
      yearly:
        amount: 100
        currency: USD
        stripe_price_id: price_comments_yearly
      one_time:
        amount: 199
        currency: USD
        stripe_price_id: price_comments_lifetime

  site_chat:
    name: Site Chat
    description: Real-time chat for team communication at restoration sites
    category: collaboration
    icon: chat
    free: false
    prices:
      monthly:
        amount: 15
        currency: USD
        stripe_price_id: price_site_chat_monthly
      yearly:
        amount: 150
        currency: USD
        stripe_price_id: price_site_chat_yearly
      # No one-time option for chat (ongoing infrastructure costs)

  # Workforce & Enterprise
  training_gates:
    name: Training Gates
    description: Training requirements and compliance tracking for team members
    category: enterprise
    icon: school
    free: false
    prices:
      monthly:
        amount: 25
        currency: USD
        stripe_price_id: price_training_gates_monthly
      yearly:
        amount: 250
        currency: USD
        stripe_price_id: price_training_gates_yearly
      one_time:
        amount: 499
        currency: USD
        stripe_price_id: price_training_gates_lifetime

  recurring_tasks:
    name: Recurring Tasks
    description: Automated scheduling and reminders for routine tasks
    category: enterprise
    icon: event_repeat
    free: false
    prices:
      monthly:
        amount: 15
        currency: USD
        stripe_price_id: price_recurring_tasks_monthly
      yearly:
        amount: 150
        currency: USD
        stripe_price_id: price_recurring_tasks_yearly
      one_time:
        amount: 299
        currency: USD
        stripe_price_id: price_recurring_tasks_lifetime

# Feature categories for UI grouping
categories:
  ai:
    name: AI & Automation
    icon: auto_awesome
    sort_order: 1
  mobile:
    name: Mobile & Offline
    icon: phone_android
    sort_order: 2
  monitoring:
    name: Monitoring & Field Work
    icon: explore
    sort_order: 3
  workflow:
    name: Workflow Actions
    icon: assignment
    sort_order: 4
  collaboration:
    name: Collaboration
    icon: group
    sort_order: 5
  enterprise:
    name: Enterprise
    icon: business
    sort_order: 6

# Mapping from legacy tier features to purchasable features
# Used for migration and backwards compatibility
legacy_tier_mapping:
  pro:
    - ai_copilot
    - offline_sync
    - monitoring_advanced
    - husbandry_actions
    - observation_actions
    - mortality_reasons
    - comments
  scale:
    - ai_copilot
    - offline_sync
    - monitoring_advanced
    - husbandry_actions
    - observation_actions
    - mortality_reasons
    - comments
    - site_chat
    - training_gates
    - recurring_tasks
