# Life Stage Constraints for 5-Axis Data Model
# Based on 5 Axis Overview specification
#
# This configuration defines which life stages are biologically valid for each organism kind
# to maintain data integrity across the 5-axis model (Taxonomy, Provenance, Location/Permit, Life Stage, Measurement).
#
# Taxonomy determines which Life Stages are valid (per 5 Axis Overview page 5)

version: "1.0"

# Organism-specific life stage constraints
# Each organism kind defines its valid life stages based on biological lifecycle
# Note: "unknown" is included in all organisms to handle incomplete data from imports,
# wild collection provenance, or cases where life stage cannot be determined.
organism_constraints:
  # Coral: gamete → larvae → recruit → juvenile → adult → broodstock
  # Note: The PDF shows "recruit" is coral-specific, while LifeStage enum has "juvenile"
  # Coral also uses "fragment" and "colony" morphologies but these map to adult/juvenile stages
  coral:
    allowed_stages:
      - unknown         # For incomplete data or undetermined life stage
      - gamete          # Reproductive cells
      - embryo          # Fertilized gamete (if tracked separately)
      - larva           # Planula larvae
      - juvenile        # Young corals (post-settlement, includes recruits)
      - adult           # Mature colonies (includes fragments as physical form)
      - broodstock      # Spawning adults
    error_message: "Life stage '{stage}' is not valid for coral. Valid stages: unknown, gamete, embryo, larva, juvenile, adult, broodstock"

  # Kelp: spore → gametophyte → sporophyte → harvest
  # Different life cycle (alternation of generations)
  kelp:
    allowed_stages:
      - unknown         # For incomplete data or undetermined life stage
      - gamete          # Spores (reproductive cells)
      - embryo          # Early gametophyte
      - larva           # Gametophyte stage (using generic "larva" for early development)
      - juvenile        # Young sporophyte
      - adult           # Mature kelp blade
    error_message: "Life stage '{stage}' is not valid for kelp. Valid stages: unknown, gamete (spore), embryo, larva (gametophyte), juvenile, adult"

  # Oyster: larvae → spat → juvenile → adult → broodstock
  oyster:
    allowed_stages:
      - unknown         # For incomplete data or undetermined life stage
      - gamete          # Reproductive cells
      - embryo          # Fertilized embryos
      - larva           # Veliger larvae
      - juvenile        # Spat and young oysters (post-settlement)
      - adult           # Market-size oysters
      - broodstock      # Spawning adults
    error_message: "Life stage '{stage}' is not valid for oyster. Valid stages: unknown, gamete, embryo, larva, juvenile (spat), adult, broodstock"

  # Seagrass: seed → seedling → vegetative → flowering
  seagrass:
    allowed_stages:
      - unknown         # For incomplete data or undetermined life stage
      - gamete          # Seeds (reproductive structures)
      - embryo          # Germinating seeds
      - juvenile        # Seedlings, young shoots
      - adult           # Vegetative and flowering plants
    error_message: "Life stage '{stage}' is not valid for seagrass. Valid stages: unknown, gamete (seed), embryo, juvenile (shoot), adult"

  # Mangrove: propagule → nursery → sapling → adult
  mangrove:
    allowed_stages:
      - unknown         # For incomplete data or undetermined life stage
      - gamete          # Seeds/propagules
      - embryo          # Germinating propagules
      - juvenile        # Nursery stage, saplings
      - adult           # Mature trees
    error_message: "Life stage '{stage}' is not valid for mangrove. Valid stages: unknown, gamete (propagule), embryo, juvenile (sapling), adult"

  # Echinoid (Urchin): broodstock → larvae → juvenile → adult
  echinoid:
    allowed_stages:
      - unknown         # For incomplete data or undetermined life stage
      - broodstock      # Spawning adults
      - gamete          # Eggs/sperm
      - embryo          # Fertilized embryos
      - larva           # Pluteus larvae
      - juvenile        # Post-metamorphic juveniles
      - adult           # Mature urchins
    error_message: "Life stage '{stage}' is not valid for urchin. Valid stages: unknown, broodstock, gamete, embryo, larva, juvenile, adult"

  # Crab: broodstock → larvae → zoea → megalopa → juvenile → adult
  # Note: zoea and megalopa are specific larval stages but map to "larva" in LifeStage enum
  crab:
    allowed_stages:
      - unknown         # For incomplete data or undetermined life stage
      - broodstock      # Spawning adults
      - gamete          # Eggs
      - embryo          # Embryonic development
      - larva           # Zoea and megalopa stages
      - juvenile        # Post-metamorphic juveniles
      - adult           # Mature crabs
    error_message: "Life stage '{stage}' is not valid for crab. Valid stages: unknown, broodstock, gamete, embryo, larva (zoea/megalopa), juvenile, adult"

  # Finfish: egg → larvae → fry → fingerling → juvenile → adult → broodstock
  # Note: fry and fingerling map to juvenile in LifeStage enum
  finfish:
    allowed_stages:
      - unknown         # For incomplete data or undetermined life stage
      - broodstock      # Spawning adults
      - gamete          # Eggs/milt
      - embryo          # Eyed eggs
      - larva           # Newly hatched larvae
      - juvenile        # Fry, fingerlings, young fish
      - adult           # Mature fish
    error_message: "Life stage '{stage}' is not valid for finfish. Valid stages: unknown, broodstock, gamete, embryo, larva, juvenile (fry/fingerling), adult"

  # Sea Cucumber: broodstock → larvae → juvenile → adult
  seaCucumber:
    allowed_stages:
      - unknown         # For incomplete data or undetermined life stage
      - broodstock      # Spawning adults
      - gamete          # Eggs/sperm
      - embryo          # Fertilized embryos
      - larva           # Auricularia larvae
      - juvenile        # Post-metamorphic juveniles
      - adult           # Mature sea cucumbers
    error_message: "Life stage '{stage}' is not valid for sea cucumber. Valid stages: unknown, broodstock, gamete, embryo, larva, juvenile, adult"

# Notes for future implementation:
# - OrganismKind.metadata.lifeStages currently uses String list (custom names like "recruit", "spat", "shoot")
# - This config uses LifeStage enum values (standardized across organisms)
# - Dialogs should filter LifeStage dropdown based on organism kind
# - CSV importer should validate life stage against organism kind
# - Consider adding "subtype" support for organism-specific nuances (e.g., "spat" as juvenile subtype for oyster)
