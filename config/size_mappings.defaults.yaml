# NOTE: Size band tissue/volume defaults use a standardized hemisphere model
# and can be customized in Organization > Biology.
coral:
  fragment:
    - code: XS
      unit: cm
      max: 5
    - code: S
      unit: cm
      min: 5
      max: 10
    - code: M
      unit: cm
      min: 10
      max: 20
    - code: L
      unit: cm
      min: 20
  microfragment:
    - code: XS
      unit: cm
      max: 1
    - code: S
      unit: cm
      min: 1
      max: 2
  settlementSubstrate:
    - code: Standard
      unit: cm
      min: 2
      max: 10

kelp:
  seededLineSegment:
    - code: XS
      unit: kg_per_m
      max: 1
    - code: S
      unit: kg_per_m
      min: 1
      max: 2.5
    - code: M
      unit: kg_per_m
      min: 2.5
      max: 4
    - code: L
      unit: kg_per_m
      min: 4

oyster:
  spatBag:
    - code: Nursery
      unit: count
      max: 1000
    - code: GrowOut
      unit: count
      min: 1000
      max: 3000
  individual:
    - code: Sublegal
      unit: cm
      max: 7.5
    - code: Market
      unit: cm
      min: 7.5

seagrass:
  sprigModule:
    - code: Plug
      unit: shoots_per_m2
      min: 25
      max: 50
  plotMat:
    - code: LowDensity
      unit: shoots_per_m2
      min: 50
      max: 150
    - code: HighDensity
      unit: shoots_per_m2
      min: 150

crab:
  transportBag:
    - code: Juvenile
      unit: count
      max: 200
    - code: Adult
      unit: count
      min: 200
      max: 400

finfish:
  batch:
    - code: Fry
      unit: count
      max: 5000
    - code: Fingerling
      unit: count
      min: 5000
      max: 20000
