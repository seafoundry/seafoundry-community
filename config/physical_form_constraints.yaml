# Physical Form Compatibility Constraints for 5-Axis Data Model
# Based on 5 Axis Overview specification
#
# This configuration defines which physical form types are compatible with
# which provenance types and life stages to maintain data integrity across
# the 5-axis model (Taxonomy, Provenance, Location/Permit, Life Stage, Measurement).
#
# Pattern matching uses Dart regex syntax:
# - .* matches any characters
# - ^ matches start of string
# - $ matches end of string
# - Use exact matches for specific form IDs

version: "1.0"

provenance_constraints:
  # Sexual cohorts can ONLY use container or shared substrate forms
  # Rationale: Cohorts represent groups of organisms from sexual reproduction,
  # which cannot be tracked as individual fragments or colonies
  sexualCohort:
    allowed_form_patterns:
      - ".*substrate.*"      # settlement_substrate, shared_substrate, etc.
      - ".*bag.*"            # spat_bag, oyster_bag, etc.
      - ".*container.*"      # any container
      - ".*vial.*"           # gamete_vial for small cohorts
      - ".*suspension.*"     # liquid suspension
      - ".*tank.*"           # larval_tank, rearing_tank, etc.
      - ".*tray.*"           # settlement_tray, etc.
      - ".*cage.*"           # oyster_cage, mesh_cage, etc.
      - ".*rack.*"           # rack systems
      - ".*line.*"           # long_line, vertical_line, etc.
      - ".*panel.*"          # settlement_panel
    disallowed_form_patterns:
      - ".*fragment.*"       # NOT allowed
      - ".*colony.*"         # NOT allowed
      - ".*individual.*"     # NOT allowed
      - "^microfragment$"    # NOT allowed
      - ".*plug.*"           # NOT allowed (individual tracking)
    error_message: "Sexual cohorts can only be associated with container or shared substrate physical forms. Individual physical forms (fragments, colonies, plugs) are not compatible with cohorts."

  # Gamete provenance types can only use liquid/volumetric containers
  gameteEgg:
    allowed_form_patterns:
      - ".*vial.*"           # gamete_vial, aliquot_vial
      - ".*aliquot.*"        # aliquots
      - ".*liquid.*"         # liquid containers
      - ".*suspension.*"     # liquid suspension
      - ".*container.*"      # generic containers (if liquid)
    disallowed_form_patterns:
      - ".*substrate.*"      # NOT allowed
      - ".*fragment.*"       # NOT allowed
      - ".*colony.*"         # NOT allowed
      - ".*individual.*"     # NOT allowed
      - ".*bag.*"            # NOT allowed (solid forms)
    error_message: "Gamete eggs can only be stored in liquid/volumetric containers (vials, aliquots). Solid substrates and individual forms are not compatible."

  gameteSperm:
    allowed_form_patterns:
      - ".*vial.*"           # gamete_vial, aliquot_vial
      - ".*aliquot.*"        # aliquots
      - ".*liquid.*"         # liquid containers
      - ".*suspension.*"     # liquid suspension
      - ".*container.*"      # generic containers (if liquid)
    disallowed_form_patterns:
      - ".*substrate.*"      # NOT allowed
      - ".*fragment.*"       # NOT allowed
      - ".*colony.*"         # NOT allowed
      - ".*individual.*"     # NOT allowed
      - ".*bag.*"            # NOT allowed (solid forms)
    error_message: "Gamete sperm can only be stored in liquid/volumetric containers (vials, aliquots). Solid substrates and individual forms are not compatible."

  # Wild-collected organisms - no restrictions
  # Can be fragments, colonies, individuals, or groups depending on collection method
  wild: {}

  # Transfer/import - no restrictions
  # Organisms received from external sources
  transfer: {}

  # Graduated individuals - no restrictions
  # Can transition between forms as they grow
  graduatedIndividual: {}

life_stage_constraints:
  # Gametes can ONLY use liquid/volumetric containers
  # Rationale: Gametes are reproductive cells in liquid suspension
  gamete:
    allowed_form_patterns:
      - ".*vial.*"           # gamete_vial, aliquot_vial
      - ".*aliquot.*"        # aliquots
      - ".*liquid.*"         # liquid containers
      - ".*suspension.*"     # liquid suspension
      - ".*container.*"      # generic containers (if liquid)
    disallowed_form_patterns:
      - ".*substrate.*"      # NOT allowed
      - ".*fragment.*"       # NOT allowed
      - ".*colony.*"         # NOT allowed
      - ".*individual.*"     # NOT allowed
      - ".*bag.*"            # NOT allowed (solid forms)
      - ".*tank.*"           # NOT allowed (too large scale)
    error_message: "Gametes can only be stored in liquid/volumetric containers (vials, aliquots). Solid substrates and individual forms are not compatible with gamete life stage."

  # Embryo - prefer liquid containers but allow substrates for attached embryos
  embryo:
    allowed_form_patterns:
      - ".*vial.*"           # aliquot_vial for embryo culture
      - ".*aliquot.*"        # aliquots
      - ".*suspension.*"     # liquid suspension
      - ".*container.*"      # containers
      - ".*substrate.*"      # settlement_substrate (for attached embryos)
      - ".*tank.*"           # larval_tank (for embryo culture)
    disallowed_form_patterns:
      - ".*fragment.*"       # NOT allowed
      - ".*colony.*"         # NOT allowed
    error_message: "Embryos can be stored in liquid containers or settlement substrates, but not as fragments or colonies."

  # Larva - prefer tanks and containers
  larva:
    allowed_form_patterns:
      - ".*tank.*"           # larval_tank, rearing_tank
      - ".*suspension.*"     # liquid suspension
      - ".*container.*"      # containers
      - ".*vial.*"           # vials for small cultures
      - ".*substrate.*"      # settlement_substrate (for settling larvae)
      - ".*bag.*"            # spat_bag (for settling larvae)
      - ".*tray.*"           # settlement_tray
    disallowed_form_patterns:
      - ".*fragment.*"       # NOT allowed
      - ".*colony.*"         # NOT allowed
    error_message: "Larvae can be reared in tanks, containers, or settlement substrates, but not as fragments or colonies."

  # Broodstock cannot use container/volumetric physical forms or mounted individuals
  # Rationale: Broodstock are mature, reproductively active organisms maintained
  # for spawning purposes. They are tracked as free-standing individuals or colonies,
  # not in containers or on propagation plugs.
  broodstock:
    disallowed_form_patterns:
      - ".*container.*"      # NOT allowed
      - ".*vial.*"           # NOT allowed
      - ".*aliquot.*"        # NOT allowed
      - ".*liquid.*"         # NOT allowed
      - ".*suspension.*"     # NOT allowed
      - ".*bag.*"            # NOT allowed (container-like)
      - ".*tank.*"           # NOT allowed (container-like)
      - ".*tray.*"           # NOT allowed (container-like)
      - "^mounted_individual$"  # NOT allowed (plugs are for propagation, not broodstock)
    error_message: "Container physical forms and mounted individuals (plugs) cannot be applied to broodstock life stage per 5-axis specification. Broodstock must be tracked as free-standing individuals, colonies, or shared substrates."

  # Other life stages have no restrictions (rely on organism-specific configs)
  # These stages can use organism-specific physical forms as defined in taxonomy configs
  juvenile: {}
  adult: {}
  spat: {}
  settler: {}
  recruit: {}
  fragment: {}
  colony: {}
  sporophyte: {}
  gametophyte: {}

# Organism-Specific Physical Forms:
# Some physical forms are organism-specific and defined only in organism_physical_forms.yaml.
# The constraint service validates based on form ID patterns, so organism-specific forms
# will naturally fail validation for other organisms (no config = not available).
#
# Examples of organism-specific physical forms:
# - mounted_individual (coral only): Fragment or juvenile mounted on substrate plug/disk.
#   Available for: coral, life stages: juvenile, adult (NOT gamete, larva, broodstock).
#   Distinguishes between mounted (on plug) vs unmounted (free-standing) individuals.
#
# Future extensions:
# - Additional organism-specific forms (e.g., oyster: individual_on_shell)
# - Transition rules (e.g., gamete -> embryo requires form change)
# - Measurement compatibility (e.g., certain forms require certain measurements)
