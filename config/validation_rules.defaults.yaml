# Validation Rules Configuration
# These are optional validation rules that provide warnings or guidance.
# Size is NOT required for any record - it's metadata for computing:
#   - count (number of individuals)
#   - volumeCm3 (volume including substrate)
#   - tissueAreaCm2 (living tissue area)
#
# Physical form and 5-axis constraints are enforced separately in
# physical_form_constraints.yaml

coral:
  # Density warning for batch tracking
  - id: coral_batch_density_warning
    description: High batch density may require splitting for health
    severity: warning
    type: measurementRange
    config:
      max: 500
      message: 'Batch has >500 fragments; consider splitting for health monitoring.'

kelp:
  # Seeded line length guidance (informational only)
  - id: kelp_seeded_line_length_guidance
    description: Seeded line segments typically range 0.5-50m
    severity: warning
    type: sizeRange
    config:
      min: 0.5
      max: 50
      unit: m
      requireMeasurement: false
      message: 'Seeded line length outside typical 0.5-50m range.'
  # Biomass density warning
  - id: kelp_seeded_line_biomass
    description: High biomass per meter may trigger harvest consideration
    severity: warning
    type: measurementRange
    config:
      max: 8
      message: 'Kelp biomass exceeds 8 kg/m; consider harvesting.'

oyster:
  # Spat bag density warning
  - id: oyster_spat_bag_density
    description: Spat bags should be thinned once they exceed density thresholds
    severity: warning
    type: measurementRange
    config:
      max: 2000
      message: 'Spat bag density exceeds 2000; consider thinning.'
  # Shell height guidance for harvest readiness
  - id: oyster_harvest_readiness_guidance
    description: Oysters typically reach market size at 75mm+
    severity: info
    type: sizeRange
    config:
      min: 75
      unit: mm
      requireMeasurement: false
      message: 'Shell height approaching harvest size (75mm+).'

# Mangrove, seagrass, and other organisms have no default validation rules.
# Organizations can add custom rules via the validation rule registry API.
