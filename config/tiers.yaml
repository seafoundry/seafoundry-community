tiers:
  - community
  - pro
  - scale

# Modules and file globs with their minimum required tier.
# Files can also declare an explicit tier via a header comment:
#   // @tier: community|pro|scale|shared
modules:
  pro:
    # Monitoring workflows are Pro (advanced field workflows)
    - lib/widgets/monitoring/**
    - lib/widgets/dialogs/monitoring_dialog.dart
    - lib/widgets/spreadsheet/monitoring/**
  scale:
    # Reserved for Scale-only modules (training gates, workforce mgmt)
    - lib/workforce/**
  shared:
    # Always OK for all tiers
    - lib/**

# Optional allow/deny import rules (left permissive initially)
rules:
  deny_imports:
    # Example: community code may not import pro or scale modules
    community:
      - pro
      - scale
    pro:
      - scale
  allow_imports:
    community:
      - shared
      - community
    pro:
      - shared
      - community
      - pro
    scale:
      - shared
      - community
      - pro
      - scale

# Notes rendered by the linter on violations
messages:
  community_pro_violation: >-
    Community-tier code must not import Pro-only modules. Move the import behind
    a feature gate, duplicate a minimal interface in a shared module, or raise the
    importing file to Pro.
  community_scale_violation: >-
    Community-tier code must not import Scale-only modules.
  pro_scale_violation: >-
    Pro-tier code must not import Scale-only modules.

