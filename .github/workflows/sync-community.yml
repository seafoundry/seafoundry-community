name: Sync Community OSS Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-community:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Mark as non-blocking while tier boundaries are being fixed
    # TODO: Remove continue-on-error once community build is properly isolated
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper sync

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Make sync script executable
        run: chmod +x scripts/sync-to-community.sh scripts/community-patches.sh

      - name: Run community sync script
        run: ./scripts/sync-to-community.sh
        env:
          # Don't push to community repo in CI by default
          # Set COMMUNITY_REPO_URL in secrets to enable automatic push
          COMMUNITY_REPO_URL: ${{ secrets.COMMUNITY_REPO_URL || '' }}

      - name: Archive community build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seafoundry-community-${{ github.sha }}
          path: .community-sync-temp/
          retention-days: 30
          compression-level: 9

      - name: Generate sync summary
        if: always()
        run: |
          echo "## Community OSS Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -d ".community-sync-temp" ]]; then
            echo "### Sync Statistics" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Total files:** $(find .community-sync-temp/lib -type f -name "*.dart" | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "- **Community artifact:** seafoundry-community-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Community build created successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Community sync failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Community OSS sync failed. Check the logs for details."
          echo "::error::This may indicate issues with tier annotations or build configuration."
