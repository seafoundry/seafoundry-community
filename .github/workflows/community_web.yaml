# Community Web CI with Quality Gates
#
# RECOMMENDED BRANCH PROTECTION SETTINGS:
# Enable in GitHub Repository Settings > Branches > Branch protection rules for 'community':
# - Require status checks to pass before merging: build-test-web
# - Require pull request reviews before merging

name: Community Web CI

on:
  push:
    branches: [ community ]
  pull_request:
    branches: [ community ]

jobs:
  build-test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SF_TIER: community
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-community-${{ hashFiles('**/pubspec.lock') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Tier manifest check
        run: dart run tool/bin/tier_check.dart

      - name: Analyze with strict quality gates
        run: |
          echo "Running Flutter analyze with fatal warnings..."
          flutter analyze --fatal-warnings
          if [ $? -ne 0 ]; then
            echo "::error::Flutter analyze found issues that must be fixed"
            exit 1
          fi
          echo "✓ Analysis passed"

      - name: Test (Flutter)
        run: |
          echo "Running Flutter tests on Chrome..."
          flutter test --platform chrome
          if [ $? -ne 0 ]; then
            echo "::error::Tests failed - all tests must pass before merging"
            exit 1
          fi
          echo "✓ All tests passed"

      - name: Build Web (Community)
        run: |
          flutter build web \
            --release \
            --dart-define=SF_TIER=community \
            --tree-shake-icons

      - name: Report Build Size
        run: |
          echo "=== Web Build Size ==="
          du -sh build/web/
          ls -lh build/web/main.dart.js
