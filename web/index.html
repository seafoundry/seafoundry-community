  <!-- Google Maps JavaScript API for google_maps_flutter_web -->
  <!-- Using the web Firebase API key - ensure Maps JavaScript API is enabled in Google Cloud Console -->
  <!-- Note: google_maps_flutter package uses legacy google.maps.Marker (deprecated Feb 2024) -->
  <!-- AdvancedMarkerElement requires package update - see https://github.com/flutter/flutter/issues/140,023 -->
  <!-- Using v=weekly for latest stable features; quarterly (v=quarterly) available for stability -->
  <script>
    // Suppress known legacy marker deprecation warning until plugin migrates.
    const _consoleWarn = console.warn.bind(console);
    console.warn = (...args) => {
      const first = args.length > 0 ? args[0] : '';
      if (typeof first === 'string' &&
          first.includes('google.maps.Marker is deprecated')) {
        return;
      }
      _consoleWarn(...args);
    };
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAzcPvdR9Ig-swE86i8FQcuG7dZ5SDKN_0&v=weekly&libraries=marker&loading=async"></script>

<body>
  <!-- Load Firebase compat SDKs before Flutter bootstrap -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

  <!-- Firestore multi-tab persistence and long-polling configuration -->
  <script>
    // Enable multi-tab IndexedDB persistence before Flutter initializes.
    // This allows multiple browser tabs to share the offline cache.
    // Also enables long-polling to avoid QUIC/WebChannel issues on restricted networks.
    window.addEventListener('load', () => {
      const initFirestorePersistence = () => {
        if (typeof firebase === 'undefined' || !firebase.firestore) {
          setTimeout(initFirestorePersistence, 50);
          return;
        }
        if (!firebase.apps.length) {
          setTimeout(initFirestorePersistence, 50);
          return;
        }

        const db = firebase.firestore();

        // Enable multi-tab persistence (must be called before any other Firestore calls)
        // This resolves "Failed to obtain exclusive access to the persistence layer" errors
        db.enableMultiTabIndexedDbPersistence()
          .then(() => {
            console.info('Firestore multi-tab persistence enabled (web).');
          })
          .catch((err) => {
            if (err.code === 'failed-precondition') {
              // Multiple tabs open, persistence can only be enabled in one tab.
              // Fall back to memory-only mode for this tab.
              console.warn('Firestore multi-tab persistence already active in another tab.');
            } else if (err.code === 'unimplemented') {
              // Browser doesn't support IndexedDB
              console.warn('Firestore persistence not available in this browser.');
            } else {
              console.warn('Could not enable Firestore persistence:', err);
            }
          });

        // Configure long-polling settings
        try {
          db.settings({
            experimentalForceLongPolling: true,
            experimentalAutoDetectLongPolling: true,
            useFetchStreams: false,
          });
          console.info('Firestore long-polling configured (web).');
        } catch (e) {
          // Settings may already be applied by Flutter SDK
          console.info('Firestore settings already configured.');
        }
      };
      initFirestorePersistence();
    });
  </script>

  <!-- Define hook for firebase_auth_web -->
  <script>
    var onGoogleLibraryLoad;
  </script>

  <!-- Then load Flutter -->
  <script src="flutter_bootstrap.js" async></script>
</body>
