# Test configuration for SeaFoundry
#
# Test Tiers:
# - smoke: Critical path tests, run on every commit (< 2 min)
# - unit: All unit tests, run on every PR (5-10 min)
# - widget: Widget tests, run in merge queue (15-20 min)
# - integration: Full workflow tests, run nightly (30+ min)
# - comprehensive: Exhaustive edge case tests, run nightly
# - golden: Visual regression tests, run locally only
#
# Usage:
#   flutter test --tags smoke                    # Run only smoke tests
#   flutter test --exclude-tags integration     # Run all except integration
#   flutter test --tags "unit || smoke"         # Run smoke or unit tests

tags:
  smoke:
    description: "Critical path tests - must pass on every commit"
  unit:
    description: "Unit tests for models, services, repositories"
  widget:
    description: "Widget tests requiring Flutter test framework"
  integration:
    description: "Full workflow integration tests - slow, run nightly"
  comprehensive:
    description: "Exhaustive edge case tests - run nightly"
  golden:
    description: "Golden/screenshot tests - run locally only"

# Default timeout for all tests (prevents hanging)
timeout: 5m

# Override timeout for specific tags
tag_overrides:
  integration:
    timeout: 15m
  comprehensive:
    timeout: 10m
  golden:
    timeout: 2m

# Paths configuration
paths:
  - test/

# Concurrency settings (can be overridden via CLI)
concurrency: 4
